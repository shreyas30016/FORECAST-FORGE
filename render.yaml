services:
  - type: web
    name: forecast-forge-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn forecast_forge.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NVIDIA_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://forecast-forge-ai.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /api/v1/health
